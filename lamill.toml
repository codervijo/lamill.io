# lamill.toml — per-site config consumed by lamill (portfolio/ops) and rankmill (content/audits).
# [content] = stable identity, authored by hand. [todo] = volatile work state.
# rankmill output lives in sites/<domain>/rankmill-output/, not here.

schema = "lamill-toml-v1"

[deploy]
platform = "vercel"
production_branch = "main"
custom_domains = [
    "lamill.io",
]

[index]
indexnow_key = "f19d828bf2a8b489116525b507fd17f0"
indexnow_enabled = true

[stack]
framework = "tanstack-start"  # SSR (React 19 + Vite + nitro); deploys to Vercel via Build Output API

[content]
# Declarative content identity for this site.
# Authored by the human; consumed by rankmill to generate drafts and run audits.
# Leave fields empty until you have a deliberate answer. Empty is better than wrong.
site_type = "b2b"
primary_keyword = "engineering studio"
secondary_keywords = ["full-stack development studio", "hardware bringup", "embedded Linux engineering", "IoT product development", "web systems engineering", "product engineering studio"]
icp = "Founders and product teams that need full-stack, hardware, Linux, and IoT engineering shipped alongside their product — without building an in-house team."
urgency_trigger = ""      # what makes the reader act now (deadline, penalty, pain)
penalty = ""              # cost of inaction, in their terms (dollars, risk, time)
tone = "direct, confident, technical, no fluff"
law = ""                  # statute or regulation if applicable, else empty
